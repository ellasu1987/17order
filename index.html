<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17order 團體點餐系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 8款風格背景定義 */
        .theme-excel { background-color: #f3f4f6; color: #1f2937; }
        .theme-minimal { background-color: #ffffff; color: #111827; }
        .theme-zen { 
            background-color: #fcfbf9; 
            color: #2c3e50;
            background-image: 
                radial-gradient(circle at 92% 88%, rgba(135, 206, 235, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 88% 92%, rgba(44, 62, 80, 0.08) 0%, transparent 50%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .theme-wood { background-color: #f7f3eb; color: #4a3525; }
        .theme-snow { background-color: #f0f7ff; color: #1e3a8a; }
        .theme-taro { background-color: #fdf4f8; color: #701a75; }
        .theme-cute { background-color: #fffbeb; color: #78350f; }
        .theme-gradient { background: linear-gradient(135deg, #fdf2f8 0%, #e0e7ff 100%); color: #374151; min-height: 100vh; }
    </style>
</head>
<body class="theme-zen transition-colors duration-300">

    <!-- 頂端風格切換列 -->
    <div class="w-full bg-slate-800/80 backdrop-blur text-white px-4 py-2 flex justify-end items-center gap-4 text-sm">
        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-300">風格：</span>
            <select id="themeSelect" onchange="changeTheme(this.value)" class="bg-slate-700 text-white text-xs px-2 py-1 rounded border border-slate-600 focus:outline-none">
                <option value="zen">日極簡 (和紙藍染)</option>
                <option value="excel">EXCEL (經典灰)</option>
                <option value="minimal">極簡白 (Modern)</option>
                <option value="wood">木文青 (Warm Wood)</option>
                <option value="snow">雪花冰 (Cool Blue)</option>
                <option value="taro">珍珠奶 (Taro Milk)</option>
                <option value="cute">可愛風 (Sunny Yellow)</option>
                <option value="gradient">漸層粉 (Soft Gradient)</option>
            </select>
        </div>
        <button onclick="alert('Google 登入功能準備中')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs transition">Google 登入</button>
    </div>

    <!-- 主容器 -->
    <div class="max-w-6xl mx-auto px-4 py-6">
        
        <!-- 官方固定 LOGO 區塊 (已移除上傳按鈕) -->
        <div class="flex justify-center items-center my-6">
            <div class="flex items-center gap-3 bg-white/80 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-200/60">
                <img src="17order-logo.png" alt="17order 官方 LOGO" class="h-12 w-auto object-contain" onerror="this.onerror=null; this.src='https://api.iconify.design/lucide:utensils.svg?color=%23059669';">
                <span class="text-2xl font-bold tracking-wider text-slate-800">17order 團體點餐系統</span>
            </div>
        </div>

        <!-- 導覽列 -->
        <div class="flex flex-wrap gap-2 border-b border-slate-200 pb-3 mb-6">
            <button class="flex items-center gap-1.5 px-4 py-2 bg-emerald-600 text-white rounded-lg shadow-sm text-sm font-medium">
                <i data-lucide="shopping-cart" class="w-4 h-4"></i> 發起訂餐
            </button>
            <button class="flex items-center gap-1.5 px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 rounded-lg shadow-sm text-sm font-medium border border-slate-200">
                <i data-lucide="book-open" class="w-4 h-4"></i> 菜單管理
            </button>
            <button class="flex items-center gap-1.5 px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 rounded-lg shadow-sm text-sm font-medium border border-slate-200">
                <i data-lucide="users" class="w-4 h-4"></i> 名單分組
            </button>
            <button class="flex items-center gap-1.5 px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 rounded-lg shadow-sm text-sm font-medium border border-slate-200">
                <i data-lucide="history" class="w-4 h-4"></i> 歷史紀錄
            </button>
        </div>

        <!-- 訂餐主面板 -->
        <div class="bg-white/90 backdrop-blur rounded-2xl shadow-sm border border-slate-200/80 p-6 mb-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">今天要訂什麼？</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">1. 選擇店家菜單</label>
                    <select class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option>思宅手搖飲 (手搖飲)</option>
                        <option>福氣便當屋 (中式便當)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">2. 選擇名單分組</label>
                    <select class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option>公司同仁分機群組</option>
                        <option>福委會核心小組</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-100">
                <span class="text-xs text-slate-500">店家最新菜單更新日期：2026/11/13</span>
                <div class="flex gap-2">
                    <button class="flex items-center gap-1 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-lg hover:bg-emerald-100 transition">
                        <i data-lucide="share-2" class="w-3.5 h-3.5"></i> 複製團購連結給同事填寫
                    </button>
                    <button class="flex items-center gap-1 text-xs bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 shadow-sm transition">
                        <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> 儲存並完成點餐對帳
                    </button>
                </div>
            </div>
        </div>

        <!-- 點餐清單與明細 -->
        <div class="bg-white/90 backdrop-blur rounded-2xl shadow-sm border border-slate-200/80 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="list-ordered" class="w-4 h-4 text-emerald-600"></i> 點餐名單與金額明細
                </h3>
                <span class="text-xs text-slate-400">勾選「不點餐/請假」會自動扣除計算</span>
            </div>

            <!-- 表格 -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 border-b border-slate-200 text-xs">
                            <th class="p-3 w-12 text-center">狀態</th>
                            <th class="p-3 w-36">分機/姓名</th>
                            <th class="p-3">品項選擇</th>
                            <th class="p-3 w-32">加料/加價區</th>
                            <th class="p-3 w-40">客製條件/冰糖</th>
                            <th class="p-3 w-40">備註與細節</th>
                            <th class="p-3 w-24 text-right">小計</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-slate-700">
                        <tr>
                            <td class="p-3 text-center"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500"></td>
                            <td class="p-3 font-medium">101 王小明</td>
                            <td class="p-3"><select class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"><option>-- 請選擇品項 --</option></select></td>
                            <td class="p-3"><select class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"><option>無加價</option></select></td>
                            <td class="p-3"><input type="text" placeholder="例: 不要香菜、微辣" class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"></td>
                            <td class="p-3"><input type="text" placeholder="備註..." class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"></td>
                            <td class="p-3 text-right font-medium">$0</td>
                        </tr>
                        <tr>
                            <td class="p-3 text-center"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500"></td>
                            <td class="p-3 font-medium">102 陳小華</td>
                            <td class="p-3"><select class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"><option>-- 請選擇品項 --</option></select></td>
                            <td class="p-3"><select class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"><option>無加價</option></select></td>
                            <td class="p-3"><input type="text" placeholder="例: 不要香菜、微辣" class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"></td>
                            <td class="p-3"><input type="text" placeholder="備註..." class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-xs"></td>
                            <td class="p-3 text-right font-medium">$0</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 底部總計 -->
            <div class="flex flex-col sm:flex-row justify-between items-center mt-6 pt-4 border-t border-slate-100 text-sm gap-2">
                <div class="text-slate-600">
                    已完成點餐：<span class="font-bold text-emerald-600">0</span> 杯/份 &nbsp;&nbsp; 請假/不點：<span class="font-bold text-slate-400">0</span> 人
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 mr-2">團購估算總金額</span>
                    <span class="text-2xl font-black text-emerald-600">$0</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 風格切換邏輯
        function changeTheme(themeName) {
            const body = document.body;
            body.className = `theme-${themeName} transition-colors duration-300`;
            
            // 同步下拉選單
            document.getElementById('themeSelect').value = themeName;
        }
    </script>
</body>
</html>
