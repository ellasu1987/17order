<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17order 團體點餐系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.3s ease;
        }

        /* 8款風格背景定義 */
        body.theme-zen { 
            background-color: #fcfbf9; 
            color: #2c3e50;
            background-image: 
                radial-gradient(circle at 92% 88%, rgba(135, 206, 235, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 88% 92%, rgba(44, 62, 80, 0.08) 0%, transparent 50%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        body.theme-excel { background-color: #f3f4f6; color: #1f2937; }
        body.theme-minimal { background-color: #ffffff; color: #111827; }
        body.theme-wood { background-color: #f7f3eb; color: #4a3525; }
        body.theme-snow { background-color: #f0f7ff; color: #1e3a8a; }
        body.theme-taro { background-color: #fdf4f8; color: #701a75; }
        body.theme-cute { background-color: #fffbeb; color: #78350f; }
        body.theme-gradient { background: linear-gradient(135deg, #fdf2f8 0%, #e0e7ff 100%); color: #374151; min-height: 100vh; }
    </style>
</head>
<body class="theme-zen">

    <!-- 頂端風格切換列 -->
    <div class="w-full bg-slate-900/90 backdrop-blur text-white px-4 py-2.5 flex justify-end items-center gap-4 text-sm shadow-sm">
        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-300">介面風格：</span>
            <select id="themeSelect" onchange="changeTheme(this.value)" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="zen">🌸 日極簡 (和紙藍染)</option>
                <option value="excel">📊 EXCEL (經典灰)</option>
                <option value="minimal">✨ 極簡白 (Modern)</option>
                <option value="wood">🪵 木文青 (Warm Wood)</option>
                <option value="snow">❄️ 雪花冰 (Cool Blue)</option>
                <option value="taro">🧋 珍珠奶 (Taro Milk)</option>
                <option value="cute">🐥 可愛風 (Sunny Yellow)</option>
                <option value="gradient">🌈 漸層粉 (Soft Gradient)</option>
            </select>
        </div>
        <button onclick="alert('Google 登入功能準備中')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm">Google 登入</button>
    </div>

    <!-- 主容器 -->
    <div class="max-w-6xl mx-auto px-4 py-6">
        
        <!-- 官方固定 LOGO 區塊 (無上傳按鈕) -->
        <div class="flex justify-center items-center my-6">
            <div class="flex items-center gap-3 bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-200/80">
                <img src="17order-logo.png" alt="17order 官方 LOGO" class="h-12 w-auto object-contain" onerror="this.onerror=null; this.src='https://api.iconify.design/lucide:utensils.svg?color=%23059669';">
                <span class="text-2xl font-bold tracking-wider text-slate-800">17order 團體點餐系統</span>
            </div>
        </div>
