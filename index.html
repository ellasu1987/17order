<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>17訂 - 團體點餐系統</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }

    /* 預設主題變數 (EXCEL 經典綠) */
    .theme-excel {
      --bg-main: #f3f2f1;
      --bg-card: #ffffff;
      --bg-header: #217346;
      --text-main: #323130;
      --text-muted: #605e5c;
      --border-color: #d2d0ce;
      --primary-bg: #217346;
      --primary-hover: #185c37;
      --primary-text: #ffffff;
      --accent-bg: #e1dfdd;
    }

    body.theme-excel header {
      background-color: #217346 !important;
      border-bottom: 1px solid #185c37 !important;
      color: #ffffff !important;
    }
    body.theme-excel header button {
      background-color: rgba(255, 255, 255, 0.14) !important;
      border: 1px solid rgba(255, 255, 255, 0.35) !important;
      color: #ffffff !important;
      border-radius: 4px !important;
    }
    body.theme-excel header button:hover {
      background-color: rgba(255, 255, 255, 0.25) !important;
    }
    body.theme-excel nav {
      background-color: #f3f2f1 !important;
      border-bottom: 1px solid #d4d4d4 !important;
      padding-top: 4px;
    }
    body.theme-excel .tab-btn {
      border-radius: 0 !important;
      border: 1px solid transparent !important;
      border-bottom: 3px solid transparent !important;
      color: #323130 !important;
      padding: 0.5rem 1.25rem !important;
      margin-right: 2px;
    }
    body.theme-excel .tab-btn.border-amber-600 {
      background-color: #ffffff !important;
      border-top: 1px solid #d4d4d4 !important;
      border-left: 1px solid #d4d4d4 !important;
      border-right: 1px solid #d4d4d4 !important;
      border-bottom: 3px solid #217346 !important;
      color: #217346 !important;
      font-weight: 700 !important;
    }
    body.theme-excel .bg-white,
    body.theme-excel section > div.bg-white {
      border-radius: 4px !important;
      border: 1px solid #c8c6c4 !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
    }
    body.theme-excel table {
      border-collapse: collapse !important;
    }
    body.theme-excel thead {
      background-color: #f3f2f1 !important;
      border-bottom: 1px solid #bfbfbf !important;
    }
    body.theme-excel th,
    body.theme-excel td {
      border: 1px solid #e1dfdd !important;
    }
    body.theme-excel th {
      color: #323130 !important;
      font-weight: 600 !important;
      text-align: center;
    }
    body.theme-excel input:focus,
    body.theme-excel select:focus {
      outline: none !important;
      border: 2px solid #217346 !important;
      border-radius: 0 !important;
      box-shadow: inset 0 0 0 1px #217346 !important;
    }
    body.theme-excel input,
    body.theme-excel select {
      border-radius: 2px !important;
      border: 1px solid #d2d0ce !important;
    }
    body.theme-excel .btn-primary {
      border-radius: 4px !important;
      background-color: #217346 !important;
      color: #ffffff !important;
    }
    body.theme-excel .bg-amber-50\/60 {
      background-color: #f3f2f1 !important;
      border-top: 2px solid #217346 !important;
    }
    body.theme-excel #grandTotalAmount {
      color: #217346 !important;
    }

    /* 極簡白風格 */
    .theme-white {
      --bg-main: #fafafa;
      --bg-card: #ffffff;
      --bg-header: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary-bg: #111827;
      --primary-hover: #374151;
      --primary-text: #ffffff;
      --accent-bg: #f3f4f6;
    }
    body.theme-white .tab-btn.border-amber-600 {
      border-bottom-color: #111827 !important;
      color: #111827 !important;
    }
    body.theme-white #grandTotalAmount {
      color: #111827 !important;
    }

    /* 日極簡風格 */
    .theme-zen {
      --bg-main: #fcfdfe;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-header: rgba(248, 250, 252, 0.94);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --primary-bg: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-text: #ffffff;
      --accent-bg: #e2e8f0;
    }
